services:
  - type: web
    name: saree-server
    runtime: node
    plan: starter
    buildCommand: npm --prefix server install
    startCommand: node server/index.js
    healthCheckPath: /api/products
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SHOP_EMAIL
        sync: false
      - key: HDFC_API_KEY
        sync: false
      - key: HDFC_MERCHANT_ID
        sync: false
      - key: HDFC_CLIENT_ID
        sync: false
      - key: HDFC_ENV
        value: production
      - key: HDFC_RESELLER_ID
        value: hdfc_reseller
      - key: PUBLIC_SERVER_URL
        sync: false
      - key: CLIENT_URL
        sync: false
    disk:
      name: saree-data
      mountPath: /var/data
      sizeGB: 1
